# Hermes Agent config for Luffy PR reviews (CI / local).
# Secrets: HERMES_HOME/.env or process env OPENROUTER_API_KEY.

model:
  provider: openrouter
  # Override with LUFFY_MODEL / OPENROUTER_MODEL.
  default: anthropic/claude-opus-5

terminal:
  backend: local

# Memory lives under HERMES_HOME/memories — cached in Actions.
