name: Offline regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
